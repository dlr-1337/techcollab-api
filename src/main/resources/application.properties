# Server Configuration
server.port=8080

# DataSource Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/techcollab_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false # Recommended for performance and to avoid potential issues

# Flyway Configuration
spring.flyway.baseline-on-migrate=true

# Springdoc/Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=br.com.techcollab.api
